name: promote-gitops-dev

on:
  workflow_run:
    workflows:
      - ci-nginx-php
    types:
      - completed

permissions:
  contents: read

jobs:
  update-gitops:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'dev'
    runs-on: ubuntu-latest

    steps:
      - name: Check out source repo
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Derive image tag from triggering commit
        id: image-tag
        run: echo "value=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
        env:
          GITHUB_SHA: ${{ github.event.workflow_run.head_sha }}

      - name: Resolve GitOps repo settings
        id: gitops-repo
        run: |
          full_name="${{ vars.GITOPS_REPO_FULL_NAME || 'tconuorah/laravel-eks-gitops-repo' }}"
          owner="${full_name%%/*}"
          repo="${full_name#*/}"
          branch="${{ vars.GITOPS_REPO_DEFAULT_BRANCH || 'main' }}"

          echo "full_name=$full_name" >> "$GITHUB_OUTPUT"
          echo "owner=$owner" >> "$GITHUB_OUTPUT"
          echo "repo=$repo" >> "$GITHUB_OUTPUT"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.GITOPS_APP_ID }}
          private-key: ${{ secrets.GITOPS_APP_PRIVATE_KEY }}
          owner: ${{ steps.gitops-repo.outputs.owner }}
          repositories: ${{ steps.gitops-repo.outputs.repo }}

      - name: Check out GitOps repo
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.gitops-repo.outputs.full_name }}
          ref: ${{ steps.gitops-repo.outputs.branch }}
          token: ${{ steps.app-token.outputs.token }}
          path: gitops-repo

      - name: Update Argo CD application manifest
        run: |
          python3 scripts/update_argocd_application.py \
            --file gitops-repo/clusters/dev/app-laravel.yaml \
            --revision "${{ github.event.workflow_run.head_sha }}" \
            --nginx-tag "${{ steps.image-tag.outputs.value }}" \
            --php-tag "${{ steps.image-tag.outputs.value }}"

      - name: Commit and push GitOps promotion branch
        id: commit-gitops
        working-directory: gitops-repo
        env:
          PROMOTION_BRANCH: promote/dev-${{ github.event.workflow_run.head_sha }}
        run: |
          git config user.name "gitops-promoter[bot]"
          git config user.email "gitops-promoter[bot]@users.noreply.github.com"

          if git diff --quiet; then
            echo "No GitOps changes detected"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git checkout -B "$PROMOTION_BRANCH"
          git add clusters/dev/app-laravel.yaml
          git commit -m "Promote dev to ${{ github.event.workflow_run.head_sha }}"
          git push --force-with-lease origin "$PROMOTION_BRANCH"

          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "branch=$PROMOTION_BRANCH" >> "$GITHUB_OUTPUT"

      - name: Create or update GitOps pull request
        if: steps.commit-gitops.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GITOPS_REPO: ${{ steps.gitops-repo.outputs.full_name }}
          BASE_BRANCH: ${{ steps.gitops-repo.outputs.branch }}
          HEAD_BRANCH: ${{ steps.commit-gitops.outputs.branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          existing_pr_number="$(gh pr list \
            --repo "$GITOPS_REPO" \
            --base "$BASE_BRANCH" \
            --head "$HEAD_BRANCH" \
            --state open \
            --json number \
            --jq '.[0].number')"

          if [ -n "$existing_pr_number" ]; then
            gh pr edit "$existing_pr_number" \
              --repo "$GITOPS_REPO" \
              --title "Promote dev to $HEAD_SHA" \
              --body "Automated GitOps promotion for source commit \`$HEAD_SHA\`."
            echo "Updated existing PR #$existing_pr_number"
            exit 0
          fi

          gh pr create \
            --repo "$GITOPS_REPO" \
            --base "$BASE_BRANCH" \
            --head "$HEAD_BRANCH" \
            --title "Promote dev to $HEAD_SHA" \
            --body "Automated GitOps promotion for source commit \`$HEAD_SHA\`."
