name: ci-nginx-php

on:
  push:
    branches:
      - dev
    paths:
      - ".github/workflows/ci.yml"
      - "app/**"
      - "docker/**"

permissions:
  contents: read
  id-token: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-2' }}
  PHP_IMAGE_REPOSITORY: ${{ vars.ECR_PHP_REPOSITORY || 'php' }}
  NGINX_IMAGE_REPOSITORY: ${{ vars.ECR_NGINX_REPOSITORY || 'nginx' }}

jobs:
  app-checks:
    runs-on: ubuntu-latest
    env:
      APP_ENV: testing
      DB_CONNECTION: sqlite
      DB_DATABASE: ":memory:"

    defaults:
      run:
        working-directory: app

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          coverage: none

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Prepare Laravel environment
        run: cp .env.example .env

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Generate app key
        run: php artisan key:generate

      - name: Install npm dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Check code style
        run: ./vendor/bin/pint --test

      - name: Build frontend assets
        run: npm run build

      - name: Run test suite
        run: php artisan test

  docker-push:
    needs: app-checks
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - image_name: php
            dockerfile: docker/php/Dockerfile
          - image_name: nginx
            dockerfile: docker/nginx/Dockerfile

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Derive image tag from git commit
        id: image-tag
        run: echo "value=$(git rev-parse --short=4 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          retry-max-attempts: 3

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Generate Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.login-ecr.outputs.registry }}/${{ matrix.image_name == 'php' && env.PHP_IMAGE_REPOSITORY || env.NGINX_IMAGE_REPOSITORY }}
          tags: |
            type=raw,value=${{ steps.image-tag.outputs.value }}

      - name: Build and push ${{ matrix.image_name }} image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
