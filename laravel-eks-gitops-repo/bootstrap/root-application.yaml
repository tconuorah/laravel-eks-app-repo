apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: laravel-platform-root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/tconuorah/laravel-eks-gitops-repo.git
    targetRevision: main
    path: clusters/dev
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
