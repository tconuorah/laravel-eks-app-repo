services:
  php:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: platform_php
    working_dir: /var/www
    # Mount application source into the php-fpm container
    volumes:
      - ./:/var/www
      - ./.docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - platform

  nginx:
    image: nginx:1.25-alpine
    container_name: platform_nginx
    # Exposes the Laravel app on localhost:8080
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www
      - ./.docker/nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./.docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php
    networks:
      - platform

  mysql:
    image: mysql:8.0
    container_name: platform_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: laravel
      MYSQL_ROOT_PASSWORD: rootpass
    ports:
      - "3306:3306"
    # Persists database data between container restarts
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - platform
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  composer:
    image: composer:2.7
    container_name: platform_composer
    working_dir: /var/www
    volumes:
      - ./:/var/www
    command: composer install --no-interaction --prefer-dist
    networks:
      - platform

networks:
  platform:

volumes:
  mysql_data: